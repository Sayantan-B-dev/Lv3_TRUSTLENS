name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
          WORKER_ENABLED: "false"
          AI_PROVIDER: deterministic
          THREAT_INTEL_ENABLED: "false"
          CT_LOOKUP_ENABLED: "false"
          SESSION_SECRET: ci-only-not-a-real-secret
        run: python -m pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir apps/web typecheck
      - name: Unit tests
        run: pnpm --dir apps/web test
      - name: Production build
        run: pnpm --dir apps/web build

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile and test
        run: pnpm --dir contracts test
